name: Validate interface preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-check.yml'
      - 'preview/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check published HTML and assets
        shell: bash
        run: |
          set -euo pipefail
          preview_url="https://raw.githack.com/yajie-liangg/coach_agent_self/${GITHUB_SHA}/preview"
          curl --fail --retry 5 --retry-delay 5 --max-time 30 "${preview_url}/index.html" | grep '学习 Coach'
          asset_name="$(basename "$(find preview/assets -name '*.js' -print -quit)")"
          curl --fail --retry 5 --retry-delay 5 --max-time 30 --output /dev/null "${preview_url}/assets/${asset_name}"
